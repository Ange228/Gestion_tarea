<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rosa Boutique</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <h1>🌸 Rosa Boutique</h1>
    <p>Catálogo de cosméticos · API REST con Spring Boot</p>
</header>

<main>
    <!-- Formulario: usa el POST de la API -->
    <section class="tarjeta">
        <h2>✨ Agregar producto <small>(POST /api/productos)</small></h2>
        <form id="formulario">
            <input name="nombre" placeholder="Nombre" required>
            <input name="marca" placeholder="Marca" required>
            <input name="categoria" placeholder="Categoría" required>
            <input name="precio" type="number" step="0.01" min="0.01" placeholder="Precio" required>
            <input name="stock" type="number" min="0" placeholder="Stock" required>
            <button type="submit">Guardar 💖</button>
        </form>
        <p id="mensaje" role="status"></p>
    </section>

    <!-- Listado: usa el GET de la API -->
    <section class="tarjeta">
        <h2>🛍️ Productos <small>(GET /api/productos)</small></h2>
        <table>
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
