# Nombre de la aplicación
spring.application.name=tienda-rosa

# Puerto HTTP (en Codespaces se reenvía automáticamente)
server.port=8080

# Base de datos H2 en memoria (se borra al apagar la app)
spring.datasource.url=jdbc:h2:mem:tiendarosa
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea la tabla "productos" a partir de la clase Producto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (útil para mostrar los datos guardados)
spring.h2.console.enabled=true

# Mensajes de error sin detalles internos
server.error.include-message=always
